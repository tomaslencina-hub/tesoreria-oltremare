[package]
name = "tesoreria-oltremare"
version = "0.3.0"
description = "Tesorería de la Asociación Oltremare"
authors = ["Tomas Lencina <tomaslencina10@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tesoreria_oltremare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-clipboard-manager = "2.4.1"
enigo = "0.6.1"
urlencoding = "2.1.3"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
