# develop    -> desarrollo diario: se verifica que compile.
# test       -> se arma el instalador de PRUEBA (base de datos separada) para probar en una PC.
# production -> se arma el instalador definitivo y se publica como Release (borrador) en GitHub.
name: CI

on:
  push:
    branches: [develop, test, production]
  pull_request:
    branches: [develop, test, production]

permissions:
  contents: write

jobs:
  verificar:
    if: github.ref_name == 'develop' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri

  instalador-test:
    if: github.event_name == 'push' && github.ref_name == 'test'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:test
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-test-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  release-produccion:
    if: github.event_name == 'push' && github.ref_name == 'production'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Tesorería Oltremare v__VERSION__
          releaseBody: Instalador para Windows. Descargar el archivo .exe y ejecutarlo.
          releaseDraft: true
