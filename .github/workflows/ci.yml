# develop    -> desarrollo diario: se verifica que compile.
# test       -> instalador de PRUEBA firmado, publicado en la release "canal-test"; las apps de prueba
#               instaladas se actualizan solas desde ahí.
# production -> instalador definitivo firmado, publicado como Release v<versión>; la app definitiva
#               se actualiza sola desde la última Release.
# Cada vez que se publica, la versión (package.json) tiene que ser mayor que la anterior.
name: CI

on:
  push:
    branches: [develop, test, production]
  pull_request:
    branches: [develop, test, production]

permissions:
  contents: write

jobs:
  verificar:
    if: github.ref_name == 'develop' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked
        working-directory: src-tauri

  instalador-test:
    if: github.event_name == 'push' && github.ref_name == 'test'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --config src-tauri/tauri.test.conf.json
          tagName: canal-test
          releaseName: Canal de prueba
          releaseBody: Versiones de PRUEBA (base de datos separada). Las apps de prueba instaladas se actualizan solas.
          prerelease: true
          releaseDraft: false

  release-produccion:
    if: github.event_name == 'push' && github.ref_name == 'production'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Tesorería Oltremare v__VERSION__
          releaseBody: Instalador para Windows. Descargar el archivo .exe y ejecutarlo. Las apps ya instaladas se actualizan solas.
          releaseDraft: false
